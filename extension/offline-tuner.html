<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE SESSION TOOLS</title>
  <link rel="stylesheet" href="offline-tuner.css">
</head>
<body>
  <main>
    <h1>THE SESSION TOOLS</h1>
    <p data-availability class="availability" role="status">状態を確認中</p>
    <section data-metronome>
      <h2>Metronome</h2>
      <div class="row"><button type="button" data-bpm-down aria-label="BPMを減らす">−</button><output data-bpm>110</output> BPM <button type="button" data-bpm-up aria-label="BPMを増やす">＋</button></div>
      <label>Tempo <input data-bpm-input type="range" min="30" max="300" step="1" value="110"></label>
      <label class="row">Division <select data-subdivision><option value="1">Beat</option><option value="2">8th notes</option><option value="4">16th notes</option><option value="3">Triplets</option></select></label>
      <label class="row">Sound <select data-sound><option value="crisp">Crisp</option><option value="sharp">Sharp</option><option value="wood">Wood</option></select></label>
      <label>Volume <output data-volume>70%</output><input data-volume-input type="range" min="0" max="150" step="1" value="70"></label>
      <div class="row"><button type="button" data-play>▶ Play</button><button type="button" data-stop-audio>■ Stop</button></div>
    </section>
    <h2>Tuner</h2>
    <section class="reading" aria-label="チューナーの測定結果">
      <div data-note class="note">—</div>
      <div data-frequency class="frequency">音を鳴らしてください</div>
      <div class="meter" data-meter aria-hidden="true"><span></span><i data-dot></i></div>
      <div data-cents class="cents">— cent</div>
      <div class="directions"><span>低い</span><span>高い</span></div>
    </section>
    <p data-status class="status" role="status">待機中</p>
    <div class="row reference">基準 A4: <button type="button" data-reference-down aria-label="基準ピッチを下げる">−</button><output data-reference>440 Hz</output><button type="button" data-reference-up aria-label="基準ピッチを上げる">＋</button></div>
    <button type="button" data-start>チューナーを開始</button>
    <button type="button" data-resume hidden>再開</button>
    <button type="button" data-stop hidden>停止</button>
  </main>
  <script src="offline-tuner.js"></script>
</body>
</html>
